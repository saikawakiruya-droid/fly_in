# Tool settings read by "flake8 ." and "mypy ." (make lint / lint-strict).

[flake8]
# Never lint the virtual environment or build output.
extend-exclude = .venv,venv,env,build,dist

[mypy]
# Name modules after their path (tests/x/conftest.py -> tests.x.conftest),
# so the conftest.py files of different test folders do not clash.
explicit_package_bases = True

[mypy-tests.*]
# Tests check an attribute again after the code under test changed it;
# strict_equality (part of --strict) reports that second check as a
# non-overlapping comparison, because it remembers the first one.
strict_equality = False
